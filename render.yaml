# ==============================================================================
# PayGuard AI — Render Blueprint Deployment Specification
# ==============================================================================
# Architecture:
# 1. PostgreSQL Database: Managed PostgreSQL (payguard-db)
# 2. Backend Web Service: Node.js + Express + TypeScript + Prisma (payguard-backend)
# 3. Frontend Static Site: React + Vite + Tailwind SPA (payguard-frontend)
# External Integrations: PayPal Sandbox, Groq LLM API, Tavily Search API
# ==============================================================================

version: "1"

databases:
  - name: payguard-db
    databaseName: payguard_db
    user: payguard_user
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: payguard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TAVILY_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: payguard-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

